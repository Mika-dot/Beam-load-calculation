name: build
on:
  push:
    branches: [main, feature/universal-engineering-calculator]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore EngineeringCalculator.sln
      - run: dotnet build EngineeringCalculator.sln -c Release --no-restore
      - run: dotnet run --project tests/EngineeringCalculator.Tests -c Release --no-build
      - run: dotnet run --project src/EngineeringCalculator.Cli -c Release --no-build -- demo --output reports/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-report
          path: reports/ci-demo.*
